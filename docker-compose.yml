services:
  postgres:
    image: postgres:16-alpine
    container_name: taskboard-postgres
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
    ports:
      - "5432:5432"
    volumes:
      - taskboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: uncomment to get a web UI for the DB at http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: taskboard-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@taskboard.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  taskboard_pgdata:
