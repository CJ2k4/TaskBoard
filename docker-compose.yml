services:
  postgres:
    image: postgres:16-alpine
    container_name: taskboard-postgres
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
    ports:
      - "5432:5432"
    volumes:
      - taskboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dev-only DB web UI at http://localhost:5050. Gated behind the "dev" profile so a plain
  # `docker compose up` never starts it — start it explicitly with `docker compose --profile dev up`.
  # It must NEVER run in production: it's a full DB admin console with static default credentials.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: taskboard-pgadmin
    profiles: ["dev"]
    environment:
      # NB: pgAdmin4's email validator rejects the reserved ".local" TLD (container Exits 1 on
      # boot), so use a normal TLD here. Password must be at least 6 chars.
      PGADMIN_DEFAULT_EMAIL: admin@taskboard.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  taskboard_pgdata:
