spring.application.name=server

# --- Server ---
# Many PaaS platforms tell the app which port to bind via $PORT, and Spring's relaxed binding
# maps SERVER_PORT to server.port but NOT a bare PORT — so it has to be read explicitly, or
# the app binds 8080, the platform routes elsewhere, and the health check times out with
# nothing in the log. Back4App happens not to inject it (the port is chosen in App Settings
# and must match the Dockerfile's EXPOSE), so the 8080 default is what binds there; reading
# $PORT anyway costs nothing and keeps the image portable. (Tomcat already binds 0.0.0.0.)
server.port=${PORT:8080}
# In production the app runs behind a TLS-terminating proxy. `framework` makes Spring honour
# X-Forwarded-Proto/-Host/-For, so it sees https and the public host rather than the plain
# http hop it actually received.
server.forward-headers-strategy=framework

# --- Datasource (local Postgres via docker-compose; override with env vars) ---
# DB_URL overrides the whole thing — that is the production path, because Neon hands out one
# connection string rather than separate fields. Convert its libpq URI to JDBC form:
#   postgresql://user:pw@HOST/DB?sslmode=require&channel_binding=require   (what Neon shows)
#   jdbc:postgresql://HOST/DB?sslmode=require                              (what to set DB_URL to)
# with user/pw moved to DB_USERNAME/DB_PASSWORD below. `channel_binding` is libpq's spelling;
# pgJDBC calls it `channelBinding`, so copying Neon's string verbatim fails. sslmode=require
# is not optional — Neon refuses plaintext, and the connection crosses the public internet.
# Use Neon's DIRECT host, not the `-pooler` one: the pooler is PgBouncer in transaction mode,
# which does not support the advisory locks Flyway takes before migrating. Nothing here needs
# a proxy pool anyway — Hikari below is the pool, and it opens at most 5 connections.
# DB_HOST/DB_PORT/DB_NAME remain for supplying the parts separately (some platforms expose the
# database that way); the composed default is what local dev uses.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskboard}}
spring.datasource.username=${DB_USERNAME:taskboard}
spring.datasource.password=${DB_PASSWORD:taskboard}

# --- Connection pool ---
# Tuned for a *remote* database on a small container, which inverts the usual defaults. Hikari
# would otherwise open 10 connections and hold them forever; that is wasteful against Neon
# (which bills compute time and autosuspends after ~5 min idle) and pointless on 0.25 CPU,
# where the app cannot service 10 concurrent queries anyway.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
# Neon autosuspends idle computes and the first query after that pays a cold resume. Idle
# connections are also silently dropped by the intervening NAT/proxy, so recycle them well
# before anything else decides to: max-lifetime under any upstream idle timeout, and a
# validation probe so a dead connection is replaced rather than handed to a request.
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=90000
# Generous on purpose: a resuming Neon compute can take a few seconds to accept the first
# connection, and failing the request would turn a normal cold start into a visible error.
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# --- Tomcat ---
# Tomcat's default ceiling is 200 request threads. At 512k of stack each that is a worst case
# of ~100 MB on a 256 MB container — enough to turn a traffic spike into an OOM kill, and the
# app cannot usefully run 200 threads on a quarter of a CPU regardless. The documented scale
# target is <=10 concurrent users per board, so 25 is generous. WebSocket sessions are NIO and
# do not each hold a thread, so this does not cap how many people can watch a board.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:25}

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only validates entity mappings against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
# HS256 signing secret. MUST be >= 32 bytes. The default here is for LOCAL DEV ONLY;
# production sets JWT_SECRET to a long random value. Anyone with this secret can forge
# tokens, so it is never a real secret in source.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-in-prod-0123456789}
# Access tokens are short-lived (sent on every request); refresh tokens live longer and
# are only used to mint new access tokens. ISO-8601 durations.
app.jwt.access-ttl=${JWT_ACCESS_TTL:PT15M}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:P7D}

# --- Google OAuth ---
# The OAuth 2.0 Web client ID from Google Cloud Console. It's the audience a Google Sign-In
# ID token must match. Empty by default so the app still boots without Google configured;
# set GOOGLE_CLIENT_ID to enable "Continue with Google". Not a secret (it's public), but
# environment-specific, so it comes from config/env rather than being hard-coded.
app.google.client-id=${GOOGLE_CLIENT_ID:486022555250-7sh5mfng9n6umk73v7gvke2chrnkn954.apps.googleusercontent.com}

# --- CORS / allowed browser origins ---
# Comma-separated origins allowed to call the REST API and open the /ws WebSocket. Read by
# both auth/security/SecurityConfig and realtime/config/WebSocketConfig — the socket must
# never be laxer than the API. Production sets APP_CORS_ALLOWED_ORIGINS to the deployed
# frontend origin (no trailing slash); leaving it unset in production blocks every call.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
