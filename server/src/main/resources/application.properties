spring.application.name=server

# --- Server ---
# Render (like most PaaS) tells the app which port to bind via $PORT. Spring's relaxed
# binding maps SERVER_PORT to server.port but NOT a bare PORT, so it has to be read
# explicitly — otherwise the app binds 8080, the platform routes elsewhere, and the health
# check times out with nothing in the log. 8080 stays the local default. (Tomcat already
# binds 0.0.0.0, so no server.address is needed.)
server.port=${PORT:8080}
# In production the app runs behind a TLS-terminating proxy. `framework` makes Spring honour
# X-Forwarded-Proto/-Host/-For, so it sees https and the public host rather than the plain
# http hop it actually received.
server.forward-headers-strategy=framework

# --- Datasource (local Postgres via docker-compose; override with env vars) ---
# DB_URL overrides the whole thing (CI does this); alternatively DB_HOST/DB_PORT/DB_NAME can
# be supplied individually, which is what the Render blueprint does — Render exposes the
# database as separate fields, not a JDBC URL, and render.yaml cannot concatenate strings.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskboard}}
spring.datasource.username=${DB_USERNAME:taskboard}
spring.datasource.password=${DB_PASSWORD:taskboard}

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only validates entity mappings against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
# HS256 signing secret. MUST be >= 32 bytes. The default here is for LOCAL DEV ONLY;
# production sets JWT_SECRET to a long random value. Anyone with this secret can forge
# tokens, so it is never a real secret in source.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-in-prod-0123456789}
# Access tokens are short-lived (sent on every request); refresh tokens live longer and
# are only used to mint new access tokens. ISO-8601 durations.
app.jwt.access-ttl=${JWT_ACCESS_TTL:PT15M}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:P7D}

# --- Google OAuth ---
# The OAuth 2.0 Web client ID from Google Cloud Console. It's the audience a Google Sign-In
# ID token must match. Empty by default so the app still boots without Google configured;
# set GOOGLE_CLIENT_ID to enable "Continue with Google". Not a secret (it's public), but
# environment-specific, so it comes from config/env rather than being hard-coded.
app.google.client-id=${GOOGLE_CLIENT_ID:486022555250-7sh5mfng9n6umk73v7gvke2chrnkn954.apps.googleusercontent.com}

# --- CORS / allowed browser origins ---
# Comma-separated origins allowed to call the REST API and open the /ws WebSocket. Read by
# both auth/security/SecurityConfig and realtime/config/WebSocketConfig — the socket must
# never be laxer than the API. Production sets APP_CORS_ALLOWED_ORIGINS to the deployed
# frontend origin (no trailing slash); leaving it unset in production blocks every call.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
